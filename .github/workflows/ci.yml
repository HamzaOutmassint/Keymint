# Continuous integration: dependency audit, lint, types, tests (including
# PostgreSQL-backed tests) and a production build on Node 22.
name: CI

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:
  schedule:
    - cron: "23 7 * * *"

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  audit:
    name: Dependency CVE audit
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false

      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm

      - name: Validate dependency lockfile
        run: npm ci --ignore-scripts

      # Includes development and optional dependencies. Registry failures and
      # high/critical advisories fail the job; no automatic forced fixes.
      - name: Audit dependencies for CVEs
        run: npm audit --include=dev --include=optional --audit-level=high

  verify:
    if: github.event_name != 'schedule'
    name: Lint, types, tests and build
    runs-on: ubuntu-latest
    timeout-minutes: 30
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_USER: keymint_test
          POSTGRES_PASSWORD: keymint_test_password
          POSTGRES_DB: keymint_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U keymint_test -d keymint_test"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 12
    env:
      NEXT_TELEMETRY_DISABLED: "1"
      DATABASE_URL: postgresql://keymint_test:keymint_test_password@127.0.0.1:5432/keymint_test
      RUN_DATABASE_TESTS: "1"
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false

      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Prepare database
        run: npx prisma generate && npx prisma migrate deploy

      - name: Lint
        run: npm run lint

      - name: Types
        run: npm run typecheck

      - name: Tests
        run: npm test

      - name: Build
        run: npm run build
        env:
          NEXT_PUBLIC_APP_URL: https://keymint.ci.invalid
