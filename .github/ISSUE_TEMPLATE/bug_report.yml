name: Bug report
description: Report something that is not working as expected.
labels: ["bug", "needs triage"]
body:
  - type: markdown
    attributes:
      value: |
        Thanks for taking the time to report a bug.

        **Security vulnerabilities must not be reported here.** See [SECURITY.md](https://github.com/HamzaOutmassint/Keymint/blob/main/SECURITY.md).
        Never paste real passwords, Recovery Keys, vault exports, session cookies or secrets into an issue.
  - type: textarea
    id: description
    attributes:
      label: What happened?
      description: A clear description of the bug.
    validations:
      required: true
  - type: textarea
    id: reproduce
    attributes:
      label: Steps to reproduce
      placeholder: |
        1. Go to ...
        2. Click ...
        3. See error ...
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: Expected behaviour
    validations:
      required: true
  - type: input
    id: version
    attributes:
      label: Keymint version or commit
      placeholder: e.g. main @ abc1234
    validations:
      required: true
  - type: dropdown
    id: setup
    attributes:
      label: How are you running Keymint?
      options:
        - Local development (npm run dev)
        - Docker Compose
        - Other self-hosted setup
    validations:
      required: true
  - type: input
    id: environment
    attributes:
      label: Browser, OS and Node.js version
      placeholder: e.g. Firefox 140 on Ubuntu 24.04, Node.js 22.22
  - type: textarea
    id: logs
    attributes:
      label: Relevant logs or screenshots
      description: Remove any personal data or secrets first. Logs are rendered as code automatically.
      render: shell
